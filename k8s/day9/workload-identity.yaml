apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
  namespace: iris
  annotations:
    iam.gke.io/gcp-service-account: wi-reader@srevert-sri023.iam.gserviceaccount.com
---
apiVersion: v1
kind: Pod
metadata:
  name: wi-test
  namespace: iris
spec:
  serviceAccountName: reader
  restartPolicy: Never
  containers:
  - name: curl
    image: curlimages/curl:8.10.1
    command: ["sh", "-c"]
    args:
    - |
      MD=http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default
      echo "Identity: $(curl -s -H 'Metadata-Flavor: Google' $MD/email)"
      TOKEN=$(curl -s -H 'Metadata-Flavor: Google' $MD/token | sed 's/.*"access_token":"\([^"]*\)".*/\1/')
      echo "Object: $(curl -s -H "Authorization: Bearer $TOKEN" https://storage.googleapis.com/storage/v1/b/srevert-sri023-wi-demo/o/hello.txt?alt=media)"
---
apiVersion: v1
kind: Pod
metadata:
  name: no-wi-test
  namespace: iris
spec:
  restartPolicy: Never
  containers:
  - name: curl
    image: curlimages/curl:8.10.1
    command: ["sh", "-c"]
    args:
    - |
      MD=http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default
      echo "Identity: $(curl -s -H 'Metadata-Flavor: Google' $MD/email)"
      TOKEN=$(curl -s -H 'Metadata-Flavor: Google' $MD/token | sed 's/.*"access_token":"\([^"]*\)".*/\1/')
      curl -s -o /dev/null -w "Object: HTTP %{http_code}\n" -H "Authorization: Bearer $TOKEN" https://storage.googleapis.com/storage/v1/b/srevert-sri023-wi-demo/o/hello.txt?alt=media
