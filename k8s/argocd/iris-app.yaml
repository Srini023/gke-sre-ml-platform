apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iris
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Srini023/gke-sre-ml-platform.git
    targetRevision: main
    path: k8s/helm/iris-api
    helm:
      releaseName: iris
  destination:
    server: https://kubernetes.default.svc
    namespace: iris-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
