replicaCount: 2

image:
  repository: europe-west3-docker.pkg.dev/srevert-sri023/iris/iris-api
  tag: "71e7a84"

service:
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceMonitor:
  enabled: true
  interval: 15s

# Fault injection switches for SLO drills (0 = off)
env:
  FAULT_ERROR_RATE: "0"
  FAULT_LATENCY_MS: "0"

# SLOs for /predict (30-day window). Budgets = 1 - objective.
slo:
  enabled: true
  route: /predict
  availability:
    objective: 99.5
    errorBudget: 0.005
  latency:
    objective: 95
    thresholdSeconds: "0.25"
    errorBudget: 0.05
